name: CI/CD Pipeline

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  validate_and_test:
    name: Validate and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run Pytest
        run: uv run pytest tests/ -vvv --cov=src/singularity --cov-report=xml

  build_and_publish:
    name: Build and Publish Images
    needs: validate_and_test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: redhat-actions/podman-login@v1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        run: podman build -t ${{ env.REGISTRY }}/${{ github.repository_owner }}/c2-backend:latest -f Containerfile .

      - name: Push backend image
        run: podman push ${{ env.REGISTRY }}/${{ github.repository_owner }}/c2-backend:latest

      - name: Build frontend image
        run: podman build -t ${{ env.REGISTRY }}/${{ github.repository_owner }}/c2-frontend:latest -f frontend_react/Containerfile frontend_react

      - name: Push frontend image
        run: podman push ${{ env.REGISTRY }}/${{ github.repository_owner }}/c2-frontend:latest

  deploy_to_production:
    name: Deploy to Production
    needs: build_and_publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup SSH and Deploy
        env:
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          SSH_USER: ${{ secrets.PROD_USER }}
          SSH_HOST: ${{ secrets.PROD_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H $SSH_HOST >> ~/.ssh/known_hosts
          
          echo "[SYS.LOG] Copying compose file to server..."
          scp -i ~/.ssh/deploy_key deployment/podman-compose.yml $SSH_USER@$SSH_HOST:/home/$SSH_USER/
          
          echo "[SYS.LOG] Executing deployment on server..."
          ssh -i ~/.ssh/deploy_key $SSH_USER@$SSH_HOST "
            echo '[SYS.LOG] Pulling latest images...'
            podman-compose -f /home/$SSH_USER/deployment/podman-compose.yml pull
            echo '[SYS.LOG] Starting services...'
            podman-compose -f /home/$SSH_USER/deployment/podman-compose.yml up -d --remove-orphans
            echo '[SYS.LOG] Cleaning up unused images...'
            podman image prune -a -f
          "
