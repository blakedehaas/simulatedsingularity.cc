version: '3.8'

services:
  c2-frontend:
    image: ghcr.io/blakedehaas/c2-frontend:latest
    container_name: c2-frontend
    ports:
      - "80:80"
    networks:
      - singularity_net
    restart: unless-stopped

  c2-backend:
    image: ghcr.io/blakedehaas/c2-backend:latest
    container_name: c2-backend
    ports:
      - "4000:4000"
    volumes:
      - ./data/sqlite:/app/data/sqlite
      - ./data/vector:/app/data/vector
    env_file:
      - .env
    networks:
      - singularity_net
    restart: unless-stopped



networks:
  singularity_net:
    driver: bridge
